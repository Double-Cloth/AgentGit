name: 后端检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: agentgit
          POSTGRES_PASSWORD: agentgit_local
          POSTGRES_DB: agentgit_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentgit -d agentgit_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked
      - run: uv run --locked pytest tests/integration
  sandbox:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: agentgit
          POSTGRES_PASSWORD: agentgit_local
          POSTGRES_DB: agentgit_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentgit -d agentgit_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked
      - run: docker version
      - run: docker build --provenance=false -f sandbox/Dockerfile -t agentgit-sandbox:ci .
      - name: 显式冻结本次 CI 镜像，核验源码与依赖
        shell: bash
        run: |
          sandbox_image_id=$(docker image inspect agentgit-sandbox:ci --format '{{.Id}}')
          uv run --locked python sandbox/prepare.py --record --image-id "$sandbox_image_id"
      - run: uv run --locked pytest tests/sandbox tests/execution --junitxml=.agentgit/evidence/sandbox-ci.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-evidence
          path: |
            .agentgit/evidence/sandbox-ci.xml
            sandbox/image.lock.json
