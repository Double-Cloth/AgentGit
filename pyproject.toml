[project]
name = "agentgit"
version = "0.1.0"
description = "可恢复、可审计的 Agent 执行历史与受控调试"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "langgraph==1.2.18",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.14.1,<3",
  "sqlalchemy>=2.0,<2.1",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
agentgit = "agentgit.cli.main:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["doc", "DESIGN.md", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.py" },
  { file = "src/**/*.json" },
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers -p no:langsmith_plugin"
markers = [
  "integration: 需要真实 PostgreSQL 的集成测试",
  "sandbox: 需要预置固定镜像和真实 Docker Linux 引擎的隔离测试",
]
