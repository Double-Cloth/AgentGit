name: agentgit
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: agentgit
      POSTGRES_PASSWORD: agentgit_local
      POSTGRES_DB: agentgit_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgit -d agentgit_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
